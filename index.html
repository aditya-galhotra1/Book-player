<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ReadAloud">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
<title>ReadAloud</title>
</head>
<body>
<main>
  <header>
    <h1>ReadAloud</h1>
    <label class="file"><input id="file" type="file" accept=".pdf,.epub,.txt,.md,.html,.htm"><span id="fileLabel">Open a PDF, EPUB or text file</span></label>
  </header>
  <p id="status" role="status">The voice model downloads once, the first time you press play.</p>
  <progress id="bar" max="100" value="0" hidden></progress>
  <select id="section" aria-label="Section" disabled></select>
  <article id="text" aria-live="polite"><p class="empty">Your text will appear here.</p></article>
  <footer>
    <div class="controls">
      <button id="prev" aria-label="Previous sentence group">⏮</button>
      <button id="play" class="main" aria-label="Play">▶</button>
      <button id="next" aria-label="Next sentence group">⏭</button>
    </div>
    <div class="row">
      <label>Voice
        <select id="voice">
          <option value="af_heart">Heart (US, female)</option>
          <option value="af_bella">Bella (US, female)</option>
          <option value="am_michael">Michael (US, male)</option>
          <option value="bf_emma">Emma (UK, female)</option>
          <option value="bm_george">George (UK, male)</option>
        </select>
      </label>
      <label>Speed <output id="speedVal">1.0×</output>
        <input id="speed" type="range" min="0.75" max="2" step="0.05" value="1">
      </label>
    </div>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
